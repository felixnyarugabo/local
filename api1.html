
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Storage Practice</title>
</head>
<body>
    <h1>My Browser Storage App</h1>

    <input id="username" type="text" placeholder="Enter your name">

    <button id="saveBtn">Save Name</button>
    <button id="showBtn">Show Name</button>
    <button id="deleteBtn">Delete Name</button>

    <p id="result">Your name will appear here.</p>

    <script>
        const username = document.getElementById("username");
        const saveBtn = document.getElementById("saveBtn");
        const showBtn = document.getElementById("showBtn");
        const deleteBtn = document.getElementById("deleteBtn");
        const result = document.getElementById("result");

        saveBtn.addEventListener("click", function () {
            const name = username.value.trim();

            if (name === "") {
                result.textContent = "Please enter your name.";
                return;
            }

            localStorage.setItem("username", name);
            result.textContent = "Name saved successfully!";
        });

        showBtn.addEventListener("click", function () {
            const savedName = localStorage.getItem("username");

            if (savedName === null) {
                result.textContent = "No name has been saved.";
            } else {
                result.textContent = "Your name is " + savedName;
            }
        });

        deleteBtn.addEventListener("click", function () {
            localStorage.removeItem("username");
            result.textContent = "Saved name deleted.";
        });
    </script>
</body>
</html>
